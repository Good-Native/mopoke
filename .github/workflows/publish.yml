name: publish

on:
  push:
    tags: ["v*"]
  # auto-release.yml dispatches this workflow at a specific tag ref
  # because workflows triggered by GITHUB_TOKEN do not cascade. The
  # version-match step still gates against package.json.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — no token required
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm 11.5.1+
      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
          echo "Tag $REF_NAME matches package version $pkg_version"

      - name: Publish to npm
        run: npm publish
