name: publish

on:
  push:
    tags: ["v*"]
  # auto-release.yml dispatches this workflow at a specific tag ref
  # because workflows triggered by GITHUB_TOKEN do not cascade. The
  # version-match step still gates against package.json.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
          echo "Tag $REF_NAME matches package version $pkg_version"

      # Same publishing credentials as Good-Native/hover: the npm access
      # token lives in 1Password and is loaded via the org service account.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@eb2efd0703da22a93c467f2d1ffbb6826c11e19c # v4.1.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NPM_TOKEN: op://Good Native/npm/npm_access_token

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --access public
