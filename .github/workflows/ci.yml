name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check
        run: node --check bin/mopoke.js

      - name: Usage output on no args
        run: |
          if node bin/mopoke.js 2>/dev/null; then
            echo "::error::Expected non-zero exit with no args" >&2
            exit 1
          fi
          node bin/mopoke.js 2>&1 | grep -q "^Usage:"

      - name: Live smoke test
        run: |
          out=$(timeout 10 node bin/mopoke.js --domain=one.one.one.one --record1=1.1.1.1 || true)
          echo "$out"
          echo "$out" | grep -q "GOOD"
